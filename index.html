<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1D3FC4" />
    <title>Natio Travels — Meet your people abroad</title>
    <meta
      name="description"
      content="Meet verified travelers of your own nationality abroad — one-on-one or through group meetups. Natio Travels connects you with your people, wherever you are."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://natiotravels.com" />
    <meta property="og:title" content="Natio Travels — Meet your people abroad" />
    <meta
      property="og:description"
      content="Meet verified travelers of your own nationality abroad — one-on-one or through group meetups."
    />
    <meta property="og:image" content="https://natiotravels.com/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Natio Travels — Meet your people abroad" />
    <meta
      name="twitter:description"
      content="Meet verified travelers of your own nationality abroad — one-on-one or through group meetups."
    />
    <meta name="twitter:image" content="https://natiotravels.com/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('natio-theme');
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
